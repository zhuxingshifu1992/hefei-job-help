<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1A8C7A">
  <title>帮老弟找工作 · 首页</title>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
</head>
<body>
  <!-- 顶部栏：标题 + 备份（首屏可见） -->
  <header class="topbar">
    <div class="topbar__title">帮老弟找工作</div>
    <div class="topbar__actions">
      <button class="iconbtn" id="btnExport">导出</button>
      <button class="iconbtn" id="btnImport">导入</button>
    </div>
  </header>

  <main class="container">
    <!-- 今天要处理：逾期+今日任务置顶 -->
    <section class="section">
      <div class="section__title">今天要处理</div>
      <div id="todayList"></div>
    </section>

    <!-- 统计卡 -->
    <section class="section">
      <div class="section__title">本周概览</div>
      <div class="grid3">
        <div class="stat"><div class="stat__num" id="statJoined">0</div><div class="stat__label">已入驻平台</div></div>
        <div class="stat"><div class="stat__num" id="statActive">0</div><div class="stat__label">进行中计划</div></div>
        <div class="stat"><div class="stat__num" id="statWeek">0</div><div class="stat__label">本周完成</div></div>
      </div>
    </section>

    <!-- 快捷入口 -->
    <section class="section">
      <div class="section__title">快捷入口</div>
      <div class="quick">
        <a class="quick__item" href="info.html">
          <svg viewBox="0 0 24 24"><path d="M5 3h14v18H5zM8 7h8v2H8zM8 11h8v2H8zM8 15h5v2H8z"/></svg>
          <div><b>资讯分享</b><span>平台 / 本地 / 避坑</span></div>
        </a>
        <a class="quick__item" href="plan.html">
          <svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zM7 8l2 2 3-3M7 14l2 2 3-3M14 9h3v2h-3zM14 15h3v2h-3z"/></svg>
          <div><b>求职计划</b><span>30 天行动清单</span></div>
        </a>
      </div>
    </section>
  </main>

  <!-- 隐藏的导入文件框（app.js 触发） -->
  <input type="file" id="fileImport" accept="application/json" style="display:none">

  <!-- 底部 Tab 导航 -->
  <nav class="tabbar">
    <a class="tab" data-nav="home" href="index.html"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg><span>首页</span></a>
    <a class="tab" data-nav="info" href="info.html"><svg viewBox="0 0 24 24"><path d="M5 3h14v18H5zM8 7h8v2H8zM8 11h8v2H8zM8 15h5v2H8z"/></svg><span>资讯</span></a>
    <a class="tab" data-nav="plan" href="plan.html"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zM7 8l2 2 3-3M7 14l2 2 3-3M14 9h3v2h-3zM14 15h3v2h-3z"/></svg><span>计划</span></a>
  </nav>

  <script src="assets/js/store.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/home.js"></script>
</body>
</html>
